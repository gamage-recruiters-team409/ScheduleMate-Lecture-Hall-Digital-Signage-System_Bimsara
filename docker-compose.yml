version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: schedulemate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedulemate
      POSTGRES_PASSWORD: schedulemate
      POSTGRES_DB: schedulemate
    ports:
      - '5432:5432'
    volumes:
      - schedulemate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schedulemate -d schedulemate']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  schedulemate_postgres_data:
    driver: local
